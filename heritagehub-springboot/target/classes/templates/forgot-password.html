<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLang ?: 'en'}">
<head th:replace="~{fragments/layout :: head('Password Recovery')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="hh-section" style="background:var(--hh-bg);min-height:76vh;">
    <div class="hh-container" style="max-width:560px;">
        <p class="hh-kicker">Account Security Recovery</p>
        <h1 style="font-size:2.2rem;margin-bottom:12px;" th:text="#{recovery.title}">Security-Question Password Recovery</h1>

        <div th:if="${recoveryError}" style="margin-bottom:16px;padding:14px 18px;border:1px solid var(--hh-red);background:#FFF5F5;color:var(--hh-red-dark);border-radius:8px;font-size:0.9rem;" th:text="${recoveryError}"></div>

        <div style="background:var(--hh-white);border:1px solid var(--hh-border);border-radius:12px;padding:28px;">
            <form th:if="${step == 1}" th:action="@{/forgot-password/question}" method="post" style="display:flex;flex-direction:column;gap:14px;">
                <p class="hh-muted" style="font-size:0.9rem;">Step 1 of 3 — Enter your registered email address.</p>
                <input class="hh-input" type="email" name="email" placeholder="you@example.com" required/>
                <button type="submit" class="hh-btn hh-btn-primary">Continue</button>
            </form>

            <form th:if="${step == 2}" th:action="@{/forgot-password/verify}" method="post" style="display:flex;flex-direction:column;gap:14px;">
                <p class="hh-muted" style="font-size:0.9rem;">Step 2 of 3 — Answer the security question for <strong th:text="${recoveryEmail}"></strong>.</p>
                <div style="padding:14px;background:var(--hh-warm);border:1px solid var(--hh-border);border-radius:8px;font-weight:600;" th:text="${securityQuestion}"></div>
                <input class="hh-input" type="text" name="answer" placeholder="Your security answer" required/>
                <button type="submit" class="hh-btn hh-btn-primary">Verify Security Answer</button>
            </form>

            <form th:if="${step == 3}" th:action="@{/forgot-password/reset}" method="post" style="display:flex;flex-direction:column;gap:14px;">
                <p class="hh-muted" style="font-size:0.9rem;">Step 3 of 3 — Set a strong new password. All existing sessions will be signed out.</p>
                <input class="hh-input" type="password" name="newPassword" placeholder="New password (8+ chars, letter & number)" required/>
                <input class="hh-input" type="password" name="confirmPassword" placeholder="Confirm new password" required/>
                <button type="submit" class="hh-btn hh-btn-primary">Save New Password</button>
            </form>

            <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--hh-border);">
                <a th:href="@{/auth}" style="font-size:0.85rem;font-weight:600;color:var(--hh-red-dark);">← Back to Sign In</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
