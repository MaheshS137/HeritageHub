spring.application.name=HeritageHub
server.port=8080

# SQLite Persistence
spring.datasource.url=jdbc:sqlite:${HERITAGEHUB_DB_PATH:heritagehub.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# UTF-8 Multilingual Encoding (English, Kannada, Hindi)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Static Caching & File Uploads
spring.web.resources.cache.cachecontrol.max-age=3600
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
heritagehub.upload-dir=uploads
