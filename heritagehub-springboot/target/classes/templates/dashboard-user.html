<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLang ?: 'en'}">
<head th:replace="~{fragments/layout :: head('User Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="hh-section" style="background:var(--hh-bg);min-height:80vh;">
    <div class="hh-container">
        <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--hh-border);margin-bottom:28px;">
            <div>
                <p class="hh-kicker">USER DASHBOARD</p>
                <h1 style="font-size:2.2rem;"><span th:text="#{dashboard.welcome}">Welcome back</span>, <span th:text="${account.fullName}"></span></h1>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="hh-btn hh-btn-outline" th:text="#{nav.logout}">Sign Out</button>
            </form>
        </div>

        <div th:if="${dashError}" style="margin-bottom:18px;padding:12px 16px;border:1px solid var(--hh-red);background:#FFF5F5;color:var(--hh-red-dark);border-radius:8px;" th:text="${dashError}"></div>
        <div th:if="${dashSuccess}" style="margin-bottom:18px;padding:12px 16px;border:1px solid #166534;background:#F0FDF4;color:#166534;border-radius:8px;" th:text="${dashSuccess}"></div>

        <div class="hh-grid-2" style="margin-bottom:32px;">
            <!-- Profile & Language -->
            <div style="background:var(--hh-white);border:1px solid var(--hh-border);border-radius:10px;padding:24px;">
                <h2 style="font-size:1.35rem;margin-bottom:14px;">Profile &amp; Language Preference</h2>
                <form th:action="@{/dashboard/user/profile}" method="post" style="display:flex;flex-direction:column;gap:12px;">
                    <input class="hh-input" type="text" name="fullName" th:value="${account.fullName}" required/>
                    <input class="hh-input" type="email" th:value="${account.email}" disabled/>
                    <select class="hh-select" name="preferredLanguage">
                        <option value="en" th:selected="${account.preferredLanguage == 'en'}">English</option>
                        <option value="kn" th:selected="${account.preferredLanguage == 'kn'}">ಕನ್ನಡ (Kannada)</option>
                        <option value="hi" th:selected="${account.preferredLanguage == 'hi'}">हिन्दी (Hindi)</option>
                    </select>
                    <button type="submit" class="hh-btn hh-btn-primary">Save Profile</button>
                </form>
            </div>

            <!-- Change Password -->
            <div style="background:var(--hh-white);border:1px solid var(--hh-border);border-radius:10px;padding:24px;">
                <h2 style="font-size:1.35rem;margin-bottom:14px;">Change Password</h2>
                <form th:action="@{/dashboard/user/change-password}" method="post" style="display:flex;flex-direction:column;gap:12px;">
                    <input class="hh-input" type="password" name="currentPassword" placeholder="Current password" required/>
                    <input class="hh-input" type="password" name="newPassword" placeholder="New password" required/>
                    <input class="hh-input" type="password" name="confirmPassword" placeholder="Confirm new password" required/>
                    <button type="submit" class="hh-btn hh-btn-primary">Update Password</button>
                </form>
            </div>
        </div>

        <!-- Saved Monuments & Districts -->
        <div class="hh-grid-2" style="margin-bottom:32px;">
            <div style="background:var(--hh-white);border:1px solid var(--hh-border);border-radius:10px;padding:24px;">
                <h2 style="font-size:1.35rem;margin-bottom:14px;">Saved Favourite Monuments</h2>
                <p th:if="${#lists.isEmpty(favoriteMonuments)}" class="hh-muted">No favourite monuments saved yet.</p>
                <div th:each="m : ${favoriteMonuments}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hh-border);">
                    <div>
                        <a th:href="@{'/district/' + ${m.districtId}}" style="font-weight:600;" th:text="${m.monumentName}"></a>
                        <p class="hh-meta" th:text="${m.districtName}"></p>
                    </div>
                    <form th:action="@{'/dashboard/user/favorites/monuments/' + ${m.monumentId} + '/remove'}" method="post">
                        <button type="submit" class="hh-btn hh-btn-outline" style="min-height:32px;padding:4px 10px;font-size:12px;">Remove</button>
                    </form>
                </div>
            </div>

            <div style="background:var(--hh-white);border:1px solid var(--hh-border);border-radius:10px;padding:24px;">
                <h2 style="font-size:1.35rem;margin-bottom:14px;">Saved Districts</h2>
                <p th:if="${#lists.isEmpty(favoriteDistricts)}" class="hh-muted">No saved districts yet.</p>
                <div th:each="d : ${favoriteDistricts}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hh-border);">
                    <div>
                        <a th:href="@{'/district/' + ${d.districtId}}" style="font-weight:600;" th:text="${d.districtName}"></a>
                        <p class="hh-meta" th:text="${d.region}"></p>
                    </div>
                    <form th:action="@{'/dashboard/user/favorites/districts/' + ${d.districtId} + '/remove'}" method="post">
                        <button type="submit" class="hh-btn hh-btn-outline" style="min-height:32px;padding:4px 10px;font-size:12px;">Remove</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Recently Viewed -->
        <div style="background:var(--hh-white);border:1px solid var(--hh-border);border-radius:10px;padding:24px;">
            <h2 style="font-size:1.35rem;margin-bottom:14px;">Recently Viewed Locations</h2>
            <p th:if="${#lists.isEmpty(recentViews)}" class="hh-muted">Visit any district or heritage record to build your history.</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;">
                <a th:each="v : ${recentViews}" th:href="@{${v.routePath}}" style="padding:12px;border:1px solid var(--hh-border);border-radius:8px;background:var(--hh-bg);">
                    <p class="hh-kicker" style="margin-bottom:4px;" th:text="${v.itemType}"></p>
                    <p style="font-weight:600;font-size:0.9rem;" th:text="${v.itemTitle}"></p>
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
